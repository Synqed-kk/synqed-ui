name: Publish package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@synqed-kk"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish package
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@synqed-kk/ui@$version" version >/dev/null 2>&1; then
            echo "@synqed-kk/ui@$version is already published"
          else
            npm publish
          fi
          npm view "@synqed-kk/ui@$version" dist --json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
